# Build library and examples, and generate releases.
name: FusionEngine Client Build

on:
  push:
    # Build on a push to any branch.
    branches:
      - '**'
    # Build on a push of any tag named v* (v1.0, etc.) and generate a release.
    tags:
      - 'v*'

env:
  # Set to 'true' to upload the fusion-engine-client-core Python package to PyPI on a release, in addition to
  # fusion-engine-client. CI builds the core package on every push either way.
  PUBLISH_CORE_TO_PYPI: 'false'

jobs:
  # Check code style.
  check_style:
    name: Check Style
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    # Check Python formatting.
    - name: Check Python Formatting
      id: autopep8
      uses: peter-evans/autopep8@v1
      with:
        args: --in-place python/fusion_engine_client python/examples python/bin python/tests

    - name: Test Python Result
      if: steps.autopep8.outputs.exit-code == 2
      run: exit 1

    # Check C++ formatting.
    - name: Check C++ Formatting
      uses: jidicula/clang-format-action@v4.11.0
      with:
        clang-format-version: '13'
        check-path: '.'

  # Build the library and example applications (Bazel). Currently Linux only.
  build_bazel:
    name: Bazel Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Do a singular build for Bazel 4.2.2 to test Bazel 4.2.2.
          #
          # Bazel 4.2.2 injects -std=c++11 by default; override to c++14 for
          # googletest compatibility.
          - os: ubuntu-latest
            compiler: gcc
            version: 11
            bazel: 4.2.2
            cppstd: c++14
          # Run Bazel 6.5.0 on all compiler versions.
          #
          # Ubuntu 26.04 (ubuntu-latest) does not provide GCC 9, GCC 10, or Clang 14, so
          # pin those builds to Ubuntu 24.04.
          - os: ubuntu-24.04
            compiler: gcc
            version: 9
            bazel: 6.5.0
          - os: ubuntu-24.04
            compiler: gcc
            version: 10
            bazel: 6.5.0
          - os: ubuntu-24.04
            compiler: clang
            version: 14
            bazel: 6.5.0
          # Test all C++ standards on Bazel 6.5.0 + GCC 11.
          - os: ubuntu-latest
            compiler: gcc
            version: 11
            bazel: 6.5.0
            cppstd: c++11
          - os: ubuntu-latest
            compiler: gcc
            version: 11
            bazel: 6.5.0
            cppstd: c++14
          - os: ubuntu-latest
            compiler: gcc
            version: 11
            bazel: 6.5.0
            cppstd: c++17
          - os: ubuntu-latest
            compiler: gcc
            version: 11
            bazel: 6.5.0
            cppstd: c++20
          - os: ubuntu-latest
            compiler: gcc
            version: 11
            bazel: 6.5.0
            cppstd: c++23
    steps:
    - uses: actions/checkout@v2

    # Compile.
    - name: Install Bazel ${{ matrix.bazel }}
      uses: abhinavsingh/setup-bazel@v3
      with:
        version: ${{ matrix.bazel }}

    # The Ubuntu mirror is slow when many matrix jobs download at once, so we
    # cache the downloaded .deb packages.
    #
    # actions/cache never overwrites an existing key, so we include the month in
    # the key to pick up package updates. The OS image name (e.g., ubuntu24)
    # keeps ubuntu-latest from restoring packages from an older release.
    - name: Get apt Cache Key (Linux)
      id: apt-cache-key
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        PREFIX="apt-${ImageOS}-${{ matrix.compiler }}-${{ matrix.version }}-"
        echo "prefix=${PREFIX}" >> $GITHUB_OUTPUT
        echo "key=${PREFIX}$(date +%Y-%m)" >> $GITHUB_OUTPUT

    - name: Cache apt Packages (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      uses: actions/cache@v4
      with:
        path: ~/apt-cache
        key: ${{ steps.apt-cache-key.outputs.key }}
        restore-keys: ${{ steps.apt-cache-key.outputs.prefix }}

    - name: Setup Environment (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        # Use a cache directory that persists across runs (see above).
        mkdir -p ~/apt-cache/partial
        APT_CACHE_ARGS="-o Dir::Cache::Archives=$HOME/apt-cache -o APT::Keep-Downloaded-Packages=true"

        # Just for Github action builds set USE_BAZEL_VERSION to override the
        # .bazelversion file so we can test different Bazel versions even though
        # the recommended Bazel version will be in the .bazelversion file.
        echo "USE_BAZEL_VERSION=${{ matrix.bazel }}" >> $GITHUB_ENV

        if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
          # Some time between 2/9/2026 and 2/16/2026, the apt packages for
          # backported versions of GCC earlier than the version included in
          # Ubuntu 24.04 (GCC 13) suddenly stopped working (at least within the
          # Github Action). It's not clear why. There's no record of that apt
          # package being removed or no longer supported, but doing an
          # apt install gcc-11 now returns a 404 when trying to fetch the
          # package from any of the normal apt repos (security.ubuntu.com,
          # archive.ubuntu.com). It may be inadvertent, but either way it means
          # the builds no longer work.
          #
          # We'll pull older versions from the ubuntu-toolchain-r PPA as a
          # workaround.
          if [[ "${{ matrix.version }}" -le 11 ]]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          fi

          sudo apt install --no-install-recommends ${APT_CACHE_ARGS} gcc-${{ matrix.version }} g++-${{ matrix.version }}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ matrix.version }} 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-${{ matrix.version }} \
            --slave /usr/bin/gcov gcov /usr/bin/gcov-${{ matrix.version }}
          sudo update-alternatives --set gcc /usr/bin/gcc-${{ matrix.version }}

          echo "CC=/usr/bin/g++-${{ matrix.version }}" >> $GITHUB_ENV
        else
          sudo apt install --no-install-recommends ${APT_CACHE_ARGS} clang-${{ matrix.version }}
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ matrix.version }} 100
          sudo update-alternatives --set clang /usr/bin/clang-${{ matrix.version }}

          echo "CC=/usr/bin/clang++-${{ matrix.version }}" >> $GITHUB_ENV
        fi

        # Remove outdated packages restored from a previous month's cache.
        sudo apt-get autoclean ${APT_CACHE_ARGS}

        # apt leaves root-owned files (e.g., its lock file) in the cache
        # directory, which actions/cache can't read when saving.
        sudo chown -R "$USER" ~/apt-cache

    - name: Set C++ Standard
      run: |
        if [[ -n "${{ matrix.cppstd }}" ]]; then
          echo "CXXOPT=--cxxopt=-std=${{ matrix.cppstd }}" >> $GITHUB_ENV
        fi

    - name: Build Library
      run: |
        bazel build -c opt ${{ env.CXXOPT }} $(bazel query '//:all except tests(//:all)')

    - name: Build Examples
      run: |
        cd examples &&
        bazel build -c opt ${{ env.CXXOPT }} //:all

    - name: Run Unit Tests
      if: matrix.cppstd != 'c++11'
      run: |
        bazel test -c opt ${{ env.CXXOPT }} //:all

    - name: Install Test Files
      run: |
        mkdir test
        cp examples/bazel-bin/message_decode/message_decode ./test/
        cp examples/bazel-bin/generate_data/generate_data ./test/
        cp examples/message_decode/example_data.p1log ./test/

    # Run unit tests.
    - name: Test Message Decoding
      run: |
        cd test
        ./message_decode example_data.p1log

    - name: Test Message Encoding
      run: |
        cd test
        ./generate_data new_data.p1log &&
        ./message_decode new_data.p1log

  # Build the library and example applications (CMake).
  build_cmake:
    name: CMake Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04 (ubuntu-latest) does not provide GCC 9, GCC 10, or Clang 14, so
          # pin those builds to Ubuntu 24.04.
          - os: ubuntu-24.04
            compiler: gcc
            version: 9
          - os: ubuntu-24.04
            compiler: gcc
            version: 10
          - os: ubuntu-24.04
            compiler: clang
            version: 14
          - os: windows-latest
            compiler: msvc
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v2

    # Compile.
    - name: Install CMake 3.16.x
      uses: jwlawson/actions-setup-cmake@v1.14.1
      with:
        cmake-version: '3.16.x'

    - name: Configure VS Toolchain (Windows)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Setup Environment (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        echo "EXT=.exe" >> $GITHUB_ENV

    # The Ubuntu mirror is slow when many matrix jobs download at once, so we
    # cache the downloaded .deb packages.
    #
    # actions/cache never overwrites an existing key, so we include the month in
    # the key to pick up package updates. The OS image name (e.g., ubuntu24)
    # keeps ubuntu-latest from restoring packages from an older release.
    - name: Get apt Cache Key (Linux)
      id: apt-cache-key
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        PREFIX="apt-${ImageOS}-${{ matrix.compiler }}-${{ matrix.version }}-"
        echo "prefix=${PREFIX}" >> $GITHUB_OUTPUT
        echo "key=${PREFIX}$(date +%Y-%m)" >> $GITHUB_OUTPUT

    - name: Cache apt Packages (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      uses: actions/cache@v4
      with:
        path: ~/apt-cache
        key: ${{ steps.apt-cache-key.outputs.key }}
        restore-keys: ${{ steps.apt-cache-key.outputs.prefix }}

    - name: Setup Environment (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        # Use a cache directory that persists across runs (see above).
        mkdir -p ~/apt-cache/partial
        APT_CACHE_ARGS="-o Dir::Cache::Archives=$HOME/apt-cache -o APT::Keep-Downloaded-Packages=true"

        if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
          # Some time between 2/9/2026 and 2/16/2026, the apt packages for
          # backported versions of GCC earlier than the version included in
          # Ubuntu 24.04 (GCC 13) suddenly stopped working (at least within the
          # Github Action). It's not clear why. There's no record of that apt
          # package being removed or no longer supported, but doing an
          # apt install gcc-11 now returns a 404 when trying to fetch the
          # package from any of the normal apt repos (security.ubuntu.com,
          # archive.ubuntu.com). It may be inadvertent, but either way it means
          # the builds no longer work.
          #
          # We'll pull older versions from the ubuntu-toolchain-r PPA as a
          # workaround.
          if [[ "${{ matrix.version }}" -le 11 ]]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          fi

          sudo apt install --no-install-recommends ${APT_CACHE_ARGS} gcc-${{ matrix.version }} g++-${{ matrix.version }}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ matrix.version }} 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-${{ matrix.version }} \
            --slave /usr/bin/gcov gcov /usr/bin/gcov-${{ matrix.version }}
          sudo update-alternatives --set gcc /usr/bin/gcc-${{ matrix.version }}

          echo "CC=/usr/bin/gcc-${{ matrix.version }}" >> $GITHUB_ENV
          echo "CXX=/usr/bin/g++-${{ matrix.version }}" >> $GITHUB_ENV
        else
          sudo apt install --no-install-recommends ${APT_CACHE_ARGS} clang-${{ matrix.version }}
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-${{ matrix.version }} 100
          sudo update-alternatives --set clang /usr/bin/clang-${{ matrix.version }}

          echo "CC=/usr/bin/clang-${{ matrix.version }}" >> $GITHUB_ENV
          echo "CXX=/usr/bin/clang++-${{ matrix.version }}" >> $GITHUB_ENV
        fi

        # Remove outdated packages restored from a previous month's cache.
        sudo apt-get autoclean ${APT_CACHE_ARGS}

        # apt leaves root-owned files (e.g., its lock file) in the cache
        # directory, which actions/cache can't read when saving.
        sudo chown -R "$USER" ~/apt-cache

        echo "EXT=" >> $GITHUB_ENV

    - name: Setup Build
      run: |
        mkdir cmake_build
        cd cmake_build
        cmake -DCMAKE_INSTALL_PREFIX=install ..

    - name: Build Library And Examples (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        cd cmake_build
        make
        make install

    - name: Install Test Files (Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        mkdir test
        cp cmake_build/examples/message_decode/message_decode ./test/
        cp cmake_build/examples/generate_data/generate_data ./test/
        cp examples/message_decode/example_data.p1log ./test/

    - name: Build Library And Examples (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd cmake_build
        nmake
        nmake install

    - name: Install Test Files (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir test
        cp cmake_build/fusion_engine_client.dll ./test/
        cp cmake_build/examples/message_decode/message_decode.exe ./test/
        cp cmake_build/examples/generate_data/generate_data.exe ./test/
        cp examples/message_decode/example_data.p1log ./test/

    - name: Build External Project Example (CMake, Linux)
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        mkdir examples/external_cmake_project/build
        cd examples/external_cmake_project/build
        cmake ..
        make

    # Run unit tests.
    - name: Test Message Decoding
      run: |
        cd test
        ./message_decode${EXT} example_data.p1log

    - name: Test Message Encoding
      run: |
        cd test
        ./generate_data${EXT} new_data.p1log
        ./message_decode${EXT} new_data.p1log

  # Build the documentation.
  build_doxygen:
    name: Documentation Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        doxygen: [1.9.8]
    steps:
    - uses: actions/checkout@v2
      with:
        # Note: Checking out with full tag history for version query below.
        fetch-depth: 0

    - name: Extract Tag Name
      if: startsWith(github.ref, 'refs/tags/') || endsWith(github.ref, '/master')
      run: echo "GIT_TAG=${GITHUB_REF##*/}" >> $GITHUB_ENV

    - name: Extract Commit Hash
      if: "!(startsWith(github.ref, 'refs/tags/') || endsWith(github.ref, '/master'))"
      run: echo "GIT_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

    - name: Insert Version
      run: |
        echo "Setting documentation version to: ${GIT_TAG}"
        pip install packaging
        python3 docs/update_versions.py ${GIT_TAG}

    - name: Build Doxygen
      uses: jenseng/dynamic-uses@v1
      with:
        uses: mattnotmitt/doxygen-action@v${{ matrix.doxygen }}
        with: |
          doxyfile-path: 'Doxyfile'

    - name: Package Artifact
      run: |
        tar cf fusion-engine-client-docs.tar docs/html --transform 's|^docs/html|fusion-engine-client/docs/html|'
        tar rf fusion-engine-client-docs.tar docs/xml --transform 's|^docs/xml|fusion-engine-client/docs/xml|'
        gzip fusion-engine-client-docs.tar

    - name: Upload Artifact
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@v4
      with:
        name: fusion-engine-client-docs.tar.gz
        path: fusion-engine-client-docs.tar.gz

  # Run Python unit tests.
  test_python:
    name: Python Unit Tests
    # Ubuntu 26.04 (ubuntu-latest) does not provide Python 3.8 or 3.9 for actions/setup-python, so pin these tests
    # to Ubuntu 24.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: python
    steps:
    - uses: actions/checkout@v2

    - name: Setup Python
      if: ${{ !env.ACT }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          python/requirements-core.txt
          python/requirements.txt
          python/requirements-dev.txt

    - name: Setup Python (local)
      if: ${{ env.ACT }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python Requirements
      run: |
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Run Unit Tests
      run: |
        python -m pytest

    # Build both the full fusion-engine-client package and the fusion-engine-client-core package from the same
    # source, so they have the same version. The core package goes in its own directory, so it is only uploaded to
    # PyPI if PUBLISH_CORE_TO_PYPI is enabled.
    - name: Build Python Distributions
      if: ${{ !env.ACT }}
      run: |
        pip install build twine
        python -m build
        FUSION_ENGINE_CLIENT_CORE=1 python -m build --outdir dist-core
        twine check dist/* dist-core/*

    - name: Upload Artifact
      if: ${{ !env.ACT && matrix.python-version == '3.13' }}
      uses: actions/upload-artifact@v4
      with:
        name: python_dist
        path: python/dist

    - name: Upload Core Artifact
      if: ${{ !env.ACT && matrix.python-version == '3.13' }}
      uses: actions/upload-artifact@v4
      with:
        name: python_core_dist
        path: python/dist-core

  # Check autogenerated signal definitions.
  test_signal_defs:
    name: GNSS Signal Definitions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
    - uses: actions/checkout@v2

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python Requirements
      run: |
        pip install -r requirements.txt

    - name: Check Signal Definitions
      run: |
        python fusion_engine_client/messages/signal_def_gen.py --check-only

  # Create a release only on a tag (not on a branch push).
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check_style, build_bazel, build_cmake, build_doxygen, test_python]
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
    - name: Get Documentation Artifact
      uses: actions/download-artifact@v4
      with:
        name: fusion-engine-client-docs.tar.gz

    - name: Get Python Distribution Artifact
      uses: actions/download-artifact@v4
      with:
        name: python_dist
        path: python/dist

    - name: Get Python Core Distribution Artifact
      if: env.PUBLISH_CORE_TO_PYPI == 'true'
      uses: actions/download-artifact@v4
      with:
        name: python_core_dist
        path: python/dist-core

    - name: Create Release
      id: create_release
      uses: actions/create-release@latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Documentation To Release
      if: steps.create_release.conclusion == 'success'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: fusion-engine-client-docs.tar.gz
        asset_name: fusion-engine-client-docs.tar.gz
        asset_content_type: application/tar+gzip

    - name: Upload The Python Distribution To PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: python/dist/
        verbose: true

    - name: Upload The Python Core Distribution To PyPI
      if: env.PUBLISH_CORE_TO_PYPI == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: python/dist-core/
        verbose: true
